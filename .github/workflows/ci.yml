name: CI

# PR과 develop/main push에서 빌드+테스트. dev/prod 공통 CI.
on:
  pull_request:
  push:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # 커버리지 PR 코멘트 (MSG-249)

    # @SpringBootTest 컨텍스트 로드가 DB를 필요로 한다 (local 프로파일: localhost:5432/fillmap).
    # 로컬 docker-compose.yml과 동일한 PostGIS 이미지로 맞춘다.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: fillmap
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d fillmap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Redis(MSG-135) — 통합 테스트(local 프로파일)가 리프레시 세션·블랙리스트 스토어를 실제로 친다.
      # 로컬 docker-compose.yml 의 fillmap-local-redis 와 동일 이미지.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 아래 V 파일 검사가 base 브랜치와 비교하므로 전체 이력이 필요하다

      # 이미 적용된 V 파일을 고치면 체크섬이 어긋나 서버가 기동 실패한다 (validate-on-migrate=true).
      # deploy.md 에 금지 규칙이 있었는데도 MSG-66 이 V1 을 재작성해 dev 가 32시간 죽었다 — 문서만으론
      # 안 멈춰서 CI 로 막는다. 신규 V 파일 추가는 정상이므로 --diff-filter=M(수정)만 잡는다.
      # 불가피하면 PR 에 flyway-rewrite 라벨을 달고 deploy.md 의 복구 절차를 따를 것. (MSG-130)
      - name: Flyway V 파일 수정 검사
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'flyway-rewrite')
        run: |
          changed=$(git diff --name-only --diff-filter=M \
            "origin/${{ github.base_ref }}...HEAD" -- 'src/main/resources/db/migration/V*__*.sql')
          if [ -n "$changed" ]; then
            echo "::error::이미 적용된 Flyway V 파일이 수정됐습니다 — 체크섬 불일치로 서버가 기동 실패합니다."
            echo "$changed" | sed 's/^/  수정됨: /'
            echo "새 V 파일(V2__, V3__ ...)로 전진 수정하세요."
            echo "재작성이 불가피하면 'flyway-rewrite' 라벨 + .claude/docs/deploy.md 의 DB 정리 절차."
            exit 1
          fi
          echo "V 파일 수정 없음"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & Test
        run: ./gradlew build

      # 커버리지 측정은 위 build의 test가 JaCoCo로 수행(finalizedBy jacocoTestReport).
      # 이 스텝은 그 XML을 읽어 PR에 전체 % + 변경 파일별 % 코멘트만 단다. (MSG-249)
      # 포크발 PR은 GITHUB_TOKEN 이 읽기 전용이라 코멘트 쓰기가 실패한다 — 같은 repo 브랜치 PR에서만 실행.
      - name: 커버리지 PR 코멘트
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 테스트 커버리지
