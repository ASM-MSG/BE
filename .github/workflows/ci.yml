name: CI

# PR과 develop/main push에서 빌드+테스트. dev/prod 공통 CI.
on:
  pull_request:
  push:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # 커버리지 PR 코멘트 (MSG-249)

    # @SpringBootTest 컨텍스트 로드가 DB를 필요로 한다 (local 프로파일: localhost:5432/fillmap).
    # 로컬 docker-compose.yml과 동일한 PostGIS 이미지로 맞춘다.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: fillmap
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d fillmap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Redis(MSG-135) — 통합 테스트(local 프로파일)가 리프레시 세션·블랙리스트 스토어를 실제로 친다.
      # 로컬 docker-compose.yml 의 fillmap-local-redis 와 동일 이미지.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 아래 V 파일 검사가 base 브랜치와 비교하므로 전체 이력이 필요하다

      # 이미 적용된 V 파일을 고치면 체크섬이 어긋나 서버가 기동 실패한다 (validate-on-migrate=true).
      # deploy.md 에 금지 규칙이 있었는데도 MSG-66 이 V1 을 재작성해 dev 가 32시간 죽었다 — 문서만으론
      # 안 멈춰서 CI 로 막는다. 신규 V 파일 추가(A)만 정상이므로 허용하고, 그 외 모든 변경(수정 M·
      # 삭제 D·리네임 R·타입 변경 T 등)은 --diff-filter=a(소문자 = A 제외 전부)로 잡는다. (MSG-130, MSG-245)
      # 불가피하면 PR 에 flyway-rewrite 라벨을 달고 deploy.md 의 복구 절차를 따를 것.
      - name: Flyway V 파일 수정 검사
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'flyway-rewrite')
        run: |
          changed=$(git diff --name-status --find-renames --diff-filter=a \
            "origin/${{ github.base_ref }}...HEAD" -- 'src/main/resources/db/migration/V*__*.sql')
          if [ -n "$changed" ]; then
            echo "::error::이미 적용된 Flyway V 파일에 신규 추가(A) 외 변경(수정·삭제·리네임 등)이 있습니다 — validate 불일치로 서버가 기동 실패합니다."
            echo "$changed" | sed 's/^/  /'
            echo "새 V 파일(V11__ ...)로 전진 수정하세요."
            echo "재작성이 불가피하면 'flyway-rewrite' 라벨 + .claude/docs/deploy.md 의 DB 정리 절차."
            exit 1
          fi
          echo "V 파일에 신규 추가(A) 외 변경 없음"

      # 실 ffmpeg 테스트(FfmpegRunnerTest·VideoEncodingDurationRealFfmpegTest)는 바이너리가 없으면
      # assumeTrue 로 조용히 skip 된다. 그러면 rtm.md 에는 검증이 있는 것처럼 남고 CI 에서는 한 번도
      # 안 도는 상태가 되므로, 러너에 설치해 실제로 돌게 한다 (MSG-470 Codex 지적).
      - name: ffmpeg 설치 (실 ffmpeg 테스트용)
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffprobe -version | head -1

      # rtm.md 는 generate-rtm.sh 가 SRS FR 표·테스트 검증 마커에서 생성한다. 원천을 고치고 재생성을
      # 잊으면 커밋본이 조용히 낡는다 — 재생성이 강제될 때만 "낡지 않는다"는 약속이 성립한다. (MSG-375)
      - name: RTM 신선도 검사
        run: |
          bash scripts/generate-rtm.sh
          # PR이 rtm.md를 삭제·리네임했으면 재생성본이 untracked라 git diff에 안 잡힌다.
          # intent-to-add로 등록해 그 경우도 diff(=실패)로 드러나게 한다.
          git add -N docs/rtm.md
          if ! git diff --exit-code docs/rtm.md; then
            echo "::error::docs/rtm.md 가 낡았습니다 — scripts/generate-rtm.sh 를 실행해 재생성본을 함께 커밋하세요."
            exit 1
          fi

      # .agents/skills 는 .claude/skills 를 가리키는 심볼릭 링크다. 사본으로 되돌아가면 Claude 와
      # Codex 가 다시 다른 규칙을 읽는다 — 실제로 하루 만에 갈라졌다. (MSG-525)
      - name: 스킬 정의 단일 정본 검사
        run: |
          [ "$(git ls-files -s .agents/skills | awk '{print $1}')" = "120000" ] \
            || { echo "::error::.agents/skills 가 .claude/skills 심볼릭 링크가 아닙니다 — 사본을 만들지 말고 링크를 되돌리세요."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & Test
        run: ./gradlew build

      # 커버리지 측정은 위 build의 test가 JaCoCo로 수행(finalizedBy jacocoTestReport).
      # 이 스텝은 그 XML을 읽어 PR에 전체 % + 변경 파일별 % 코멘트만 단다. (MSG-249)
      # 포크발 PR·Dependabot PR 은 GITHUB_TOKEN 이 읽기 전용이라 코멘트 쓰기가 실패한다 —
      # 같은 repo 브랜치의 사람 PR에서만 실행. (Dependabot 은 현재 미사용이지만 켜지면 원인 불명 red CI 가 됨)
      # 판정은 트리거 액터가 아니라 PR 작성자 기준 — 재실행은 최초 트리거 액터의 권한을 쓰므로 actor 로는 못 잡는다.
      - name: 커버리지 PR 코멘트
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 테스트 커버리지
