name: CD (prod)

# main 브랜치 push -> 승인 -> prod 배포 (MSG-595 부터 도커 이미지, dev 와 같은 아티팩트).
#
# 이미지를 다시 만들지 않는다. dev CD(cd-dev.yml)가 develop 커밋마다 ECR 에 sha-<7> 태그로 올린 이미지 중
# 이 main 커밋에 해당하는 것을 찾아 `prod` 태그만 붙인다(태그 승격). main 이 develop 을 머지 커밋으로 받으면
# HEAD 자체의 이미지는 없고 HEAD^2(develop 쪽 부모)의 이미지가 그것이다. 둘 다 없을 때(squash 머지, 첫 실행)만
# 같은 Dockerfile 로 빌드하는 fallback 이 돈다.
#
# 서버 쪽은 cd-dev.yml 의 deploy-dev 와 같은 절차(compose pull/up --wait, 이미지·재시작·리스너 PID 신원 검사)이고
# 경로만 다르다: 홈 ~/fillmap-prod, env 파일 fillmap-prod.env, 관리 포트 8081 (application-prod.yml).
# environment: production 의 보호 규칙(수동 승인)이 게이트다 — 승인 전에는 prod 태그도 붙지 않는다.
# secrets(production): PROD_EC2_HOST / PROD_EC2_USER / PROD_EC2_SSH_KEY. repo variable DEPLOY_ENABLED=true.
on:
  push:
    branches: [ main ]

env:
  IMAGE: 951142447485.dkr.ecr.ap-northeast-2.amazonaws.com/fillmap
  REPO: fillmap

jobs:
  deploy-prod:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production        # 보호 규칙으로 수동 승인
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 머지 커밋이면 HEAD^2(develop 쪽 부모)가 필요하다

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951142447485:role/fillmap-ecr-push
          aws-region: ap-northeast-2

      # dev 가 검증한 이미지를 찾는다: HEAD 의 sha 태그 → 없으면 HEAD^2 의 sha 태그
      - name: Find dev-verified image
        id: find
        run: |
          for c in "$GITHUB_SHA" "$(git rev-parse -q --verify HEAD^2 2>/dev/null || true)"; do
            [ -n "$c" ] || continue
            t="sha-${c:0:7}"
            if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$t" >/dev/null 2>&1; then
              echo "dev 검증 이미지 사용: $t (커밋 $c)"; echo "tag=$t" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::warning::HEAD·HEAD^2 어느 쪽도 ECR 에 이미지가 없다 — 이 커밋으로 새로 빌드한다 (build-once 예외)"
          echo "tag=" >> "$GITHUB_OUTPUT"

      # 배포 태그: dev 검증 이미지가 있으면 그것, 없으면 이 커밋의 sha-<7> (아래 fallback 이 그 태그로 빌드한다)
      - name: Resolve tag
        id: meta
        run: |
          t="${{ steps.find.outputs.tag }}"
          [ -n "$t" ] || t="sha-${GITHUB_SHA:0:7}"
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      # ---- fallback: 이미지가 없을 때만 (cd-dev.yml build-image 와 같은 절차) ----
      - name: Set up JDK 21
        if: steps.find.outputs.tag == ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build bootJar
        if: steps.find.outputs.tag == ''
        run: ./gradlew bootJar -x test
      - name: Login to ECR
        if: steps.find.outputs.tag == ''
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        if: steps.find.outputs.tag == ''
      - name: Build & push image (fallback)
        if: steps.find.outputs.tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 태그 승격: 같은 매니페스트에 prod 태그를 붙인다 (pull/push 없음). 이미 그 이미지를 가리키면 건너뛴다.
      # 라이프사이클이 sha-* 를 20개 넘게 지워도 prod 태그가 붙은 이미지는 prod 보호 규칙(우선순위 1)에 잡혀 남는다.
      - name: Promote to prod tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          new=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          cur=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=prod --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ "$new" = "$cur" ]; then echo "prod 태그가 이미 $TAG 를 가리킨다"; exit 0; fi
          manifest=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag prod --image-manifest "$manifest" >/dev/null
          echo "prod 태그 → $TAG ($new)"

      - name: Upload compose file to prod EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: docker-compose.app.yml
          target: /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod

      - name: Deploy api container
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APP_ENV_FILE: /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod/fillmap-prod.env
          CLOUDFRONT_KEY_FILE: /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod/fillmap-prod-cloudfront-private-key.pem
          FCM_FILE: /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod/fillmap-edd7d-firebase-adminsdk-fbsvc-6559aa06cc.json
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          envs: IMAGE,TAG,APP_ENV_FILE,CLOUDFRONT_KEY_FILE,FCM_FILE
          script: |
            set -e
            cd /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod
            # 서버에 사람이 놓아야 하는 파일 셋 — 없으면 compose 가 뜨기 전에 여기서 멈춘다 (deploy.md "운영 배포" 절)
            for f in "$APP_ENV_FILE" "$CLOUDFRONT_KEY_FILE" "$FCM_FILE"; do
              [ -f "$f" ] || { echo "::error::필수 파일 없음: $f"; exit 1; }
            done
            command -v docker-credential-ecr-login >/dev/null \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq amazon-ecr-credential-helper)
            python3 - <<'PY'
            import json, os
            p = os.path.expanduser('~/.docker/config.json'); os.makedirs(os.path.dirname(p), exist_ok=True)
            try: c = json.load(open(p))
            except Exception: c = {}
            c.setdefault('credHelpers', {})['951142447485.dkr.ecr.ap-northeast-2.amazonaws.com'] = 'ecr-login'
            json.dump(c, open(p, 'w'), indent=2)
            PY
            docker compose -f docker-compose.app.yml pull -q api
            # 새 prod EC2 에는 jar 시절 유닛이 없다. 혹시 남아 있으면 dev 와 같은 순서로 치운다.
            if [ -f /etc/systemd/system/fillmap-prod.service ]; then
              sudo systemctl disable --now fillmap-prod
              sudo mv /etc/systemd/system/fillmap-prod.service ~/fillmap-prod/fillmap-prod.service.pre-msg595
              sudo systemctl daemon-reload
            fi
            sudo systemctl mask fillmap-prod
            docker compose -f docker-compose.app.yml up -d --wait --wait-timeout 180 api \
              || { echo "::error::api 컨테이너가 180초 안에 healthy 가 되지 않았다"; docker logs --tail 50 fillmap-api 2>&1 || true; exit 1; }
            # 신원 검사 (cd-dev.yml 과 같다). 리스너는 관리 포트 8081 — health 가 그 포트에서 나온다.
            running=$(docker inspect -f '{{.Config.Image}}' fillmap-api)
            restarts=$(docker inspect -f '{{.RestartCount}}' fillmap-api)
            cpid=$(docker inspect -f '{{.State.Pid}}' fillmap-api)
            listen=$(sudo ss -ltnpH 'sport = :8081' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u)
            if [ "$running" = "$IMAGE:$TAG" ] && [ "$restarts" = "0" ] && [ -n "$cpid" ] && [ "$listen" = "$cpid" ]; then
              echo "기동 확인 — healthy, image=$running, 8081 리스너(pid=$listen) = 컨테이너 PID"
            else
              echo "::error::healthy 지만 신원이 다르다 — 기대 image=$IMAGE:$TAG restarts=0 pid=$cpid / 실제 image=$running restarts=$restarts 8081 리스너 pid=[$listen]"
              sudo ss -ltnp 'sport = :8081' || true
              docker logs --tail 50 fillmap-api 2>&1 || true
              exit 1
            fi
            docker images "$IMAGE" --format '{{.Tag}}' | grep '^sha-' | grep -vx "$TAG" \
              | xargs -r -I{} docker rmi "$IMAGE:{}" >/dev/null
            docker image prune -f >/dev/null
