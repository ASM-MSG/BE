name: CD (prod)

# main 브랜치 push -> prod 환경 배포.
# environment: production 에 GitHub 보호 규칙(수동 승인 리뷰어)을 걸어 승인 후 배포한다.
# EC2(MSG-51) 준비 전까지 DEPLOY_ENABLED 로 비활성(skip). 준비되면 secrets 등록:
#   PROD_EC2_HOST / PROD_EC2_USER / PROD_EC2_SSH_KEY
# prod 앱은 systemd 서비스 fillmap-prod (profile=prod, DB 5433 컨테이너)로 상시 구동.
# 지금은 dev와 같은 EC2를 가리켜도 되고, 나중에 EC2를 분리하면 secret만 바꾸면 된다.
on:
  push:
    branches: [ main ]

jobs:
  deploy-prod:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production        # 보호 규칙으로 수동 승인
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Upload jar to prod EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: build/libs/fillmap-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod
          strip_components: 2

      - name: Restart prod service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.PROD_EC2_USER }}/fillmap-prod
            # ffmpeg 는 인코딩·선분석 probe 의 런타임 의존 — cd-dev.yml 과 같은 멱등 보장 (MSG-351)
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            mv -f fillmap-0.0.1-SNAPSHOT.jar app.jar
            sudo systemctl restart fillmap-prod

      # systemctl restart 는 기동을 '지시'하고 즉시 0 을 반환한다 — 앱이 직후 죽어도 위 step 은 성공이다 (MSG-129).
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            # health 는 관리 포트(8081, MSG-344)에서 본다 — 공개 포트에선 /actuator/** 가 404 다.
            # 200 만 통과시킨다: DB·Redis 장애면 health 가 503(DOWN)이라 "떠 있지만 병든" 배포를 잡고,
            # 미기동(000)도 당연히 실패다. 기존 "401 이 곧 기동 성공"(루트 경로 4xx 허용)은 간접
            # 신호라 폐기했다. 연결 실패 시 curl 은 000 을 '출력하므로' `|| echo 000` 을 붙이면
            # 000000 이 되어 오판한다 — `|| true` 로 실제 코드만 본다.
            # 재시도는 회수가 아니라 경과 시간으로 센다 — 회수x간격(30x5초)은 curl 대기(최대 3초)가
            # 회마다 얹혀 최악 240초까지 늘어나 명시한 150초 데드라인과 어긋났다.
            SECONDS=0
            while [ "$SECONDS" -lt 150 ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8081/actuator/health || true)
              if [ "$code" = "200" ]; then
                echo "기동 확인 — health HTTP 200 (${SECONDS}초)"
                exit 0
              fi
              sleep 5
            done
            echo "::error::150초 내 health 200 실패 (마지막 코드: $code) — 아래 로그에서 원인 확인"
            journalctl -u fillmap-prod -n 50 --no-pager
            exit 1
