name: CD (dev)

# develop 브랜치 push -> dev 환경 자동 배포.
# EC2(MSG-51) 준비 전까지는 repo variable DEPLOY_ENABLED 로 비활성(skip) 상태.
# 준비되면 Settings > Variables 에 DEPLOY_ENABLED=true, 아래 secrets 등록:
#   DEV_EC2_HOST / DEV_EC2_USER / DEV_EC2_SSH_KEY
#   AI_EC2_HOST / AI_EC2_USER / AI_EC2_SSH_KEY
# dev 앱은 EC2에서 systemd 서비스 fillmap-dev (profile=dev, DB 5432 컨테이너)로 상시 구동.
# 인코딩 워커는 AI EC2에서 fillmap-encoding-worker (profile=dev,encoding-worker)로 구동.
# DB 접속·시크릿은 각 EC2의 서비스 .env 에 있고, CD는 jar 교체 + 재시작만 한다.
on:
  push:
    branches: [ develop ]

jobs:
  deploy-dev:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Upload jar to dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: build/libs/fillmap-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.DEV_EC2_USER }}
          strip_components: 2

      - name: Restart dev service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.DEV_EC2_USER }}
            # ffmpeg 는 인코딩·선분석 probe 의 런타임 의존인데, 설치가 문서 한 줄(docs/spec/MSG-65.md D3
            # "인프라 담당이 1회 실행")뿐이라 인스턴스 교체 때 유실됐다. 사람 기억 대신 매 배포가
            # 보장한다 — 설치돼 있으면 0.1초 통과, 새 인스턴스면 다음 배포가 알아서 복구 (멱등).
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            mv -f fillmap-0.0.1-SNAPSHOT.jar app.jar
            sudo systemctl restart fillmap-dev

      # systemctl restart 는 기동을 '지시'하고 즉시 0 을 반환한다 — 앱이 직후 죽어도 위 step 은 성공이다.
      # 실제로 2026-07-14~15 dev 가 32시간 크래시 루프였는데 CD 는 계속 초록불이었다 (MSG-129).
      - name: Health check dev service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            # 성공은 HTTP 200 하나뿐이다 (cd-prod.yml 과 같은 기준). /actuator/health 는 SecurityConfig
            # 에서 permitAll 이라 정상 기동이면 200 이고, DB·Redis 가 죽으면 503 이다. 4xx 를 성공으로
            # 치던 옛 판정은 actuator 도입(MSG-128) 전 "인증 요구 응답이 곧 기동 신호"이던 시절의 잔재라,
            # actuator 노출·라우팅이 잘못되거나 다른 앱이 8080 을 물고 있어도 배포가 초록불이 됐다.
            # 앱 기동에 ~14초 걸리므로 5초 간격으로 30회(약 150초) 기다린다.
            # 연결 실패 시 curl 은 %{http_code} 로 000 을 '출력하고' non-zero 로 끝난다. 따라서
            # `|| echo 000` 을 붙이면 000000 이 되어 어떤 조건에도 걸리지 않는다 — 실제 HTTP 코드만 통과시킨다.
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/actuator/health || true)
              if [ "$code" = "200" ]; then
                # 200 만으로는 부족하다 (MSG-382) — 그 응답을 방금 재시작한 유닛이 줬는지는 별개 사실이다.
                # 고아 프로세스나 다른 앱이 8080 을 물고 있으면 재시작이 실패해도 초록불이 된다.
                # 8080 리스너의 PID 가 fillmap-dev 유닛의 MainPID 와 같을 때만 성공으로 친다.
                # 리스너 PID 는 전부 모아 유일값으로 비교한다 — v4/v6 두 소켓이 각 행으로 나오고,
                # 첫 행만 보면(head -1) 다른 프로세스가 섞여 있어도 우연히 통과할 수 있다 (Codex 리뷰).
                main_pid=$(systemctl show -p MainPID --value fillmap-dev)
                listen_pids=$(sudo ss -ltnpH 'sport = :8080' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u)
                if [ -n "$main_pid" ] && [ "$main_pid" != "0" ] && [ "$listen_pids" = "$main_pid" ]; then
                  echo "기동 확인 — HTTP 200, 8080 리스너(pid=$listen_pids) = fillmap-dev MainPID ($((i * 5))초)"
                  exit 0
                fi
                echo "::error::200 응답을 재시작한 유닛이 아닌 프로세스가 줬다 — MainPID=$main_pid, 8080 리스너 pid=[$listen_pids]"
                sudo ss -ltnp 'sport = :8080' || true
                journalctl -u fillmap-dev -n 50 --no-pager
                exit 1
              fi
              sleep 5
            done
            echo "::error::150초 내 기동 실패 — 아래 로그에서 원인 확인"
            journalctl -u fillmap-dev -n 50 --no-pager
            exit 1

      - name: Upload jar to encoding worker EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          source: build/libs/fillmap-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.AI_EC2_USER }}/encoding-worker
          strip_components: 2

      - name: Restart encoding worker service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.AI_EC2_USER }}/encoding-worker
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            mv -f fillmap-0.0.1-SNAPSHOT.jar app.jar
            sudo systemctl restart fillmap-encoding-worker

      - name: Health check encoding worker service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          script: |
            deadline_start=$(date +%s)
            while [ $(( $(date +%s) - deadline_start )) -lt 150 ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8081/actuator/health || true)
              if [ "$code" = "200" ]; then
                main_pid=$(systemctl show -p MainPID --value fillmap-encoding-worker)
                listen_pids=$(sudo ss -ltnpH 'sport = :8081' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u)
                if [ -n "$main_pid" ] && [ "$main_pid" != "0" ] && [ "$listen_pids" = "$main_pid" ]; then
                  echo "기동 확인 — health HTTP 200, 8081 리스너(pid=$listen_pids) = fillmap-encoding-worker MainPID ($(( $(date +%s) - deadline_start ))초)"
                  exit 0
                fi
                echo "::error::200 응답을 재시작한 워커가 아닌 프로세스가 줬다 — MainPID=$main_pid, 8081 리스너 pid=[$listen_pids]"
                sudo ss -ltnp 'sport = :8081' || true
                journalctl -u fillmap-encoding-worker -n 50 --no-pager
                exit 1
              fi
              sleep 5
            done
            echo "::error::150초 내 워커 health 200 실패 (마지막 코드: $code) — 아래 로그에서 원인 확인"
            journalctl -u fillmap-encoding-worker -n 50 --no-pager
            exit 1
