name: CD (dev)

# develop 브랜치 push -> dev 환경 자동 배포.
# EC2(MSG-51) 준비 전까지는 repo variable DEPLOY_ENABLED 로 비활성(skip) 상태.
# 준비되면 Settings > Variables 에 DEPLOY_ENABLED=true, 아래 secrets 등록:
#   DEV_EC2_HOST / DEV_EC2_USER / DEV_EC2_SSH_KEY
# dev 앱은 EC2에서 systemd 서비스 fillmap-dev (profile=dev, DB 5432 컨테이너)로 상시 구동.
# DB 접속·시크릿은 EC2의 서비스 .env 에 있고, CD는 jar 교체 + 재시작만 한다.
on:
  push:
    branches: [ develop ]

jobs:
  deploy-dev:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Upload jar to dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: build/libs/fillmap-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.DEV_EC2_USER }}/fillmap-dev
          strip_components: 2

      - name: Restart dev service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.DEV_EC2_USER }}/fillmap-dev
            mv -f fillmap-0.0.1-SNAPSHOT.jar app.jar
            sudo systemctl restart fillmap-dev
