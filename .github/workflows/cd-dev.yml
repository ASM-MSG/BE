name: CD (dev)

# develop 브랜치 push -> dev 환경 자동 배포 (MSG-589 부터 도커 이미지).
#
#   build-image  : jar 빌드 -> Dockerfile 로 이미지 -> ECR fillmap 에 sha-<7>·develop 태그로 push.
#                  인증은 GitHub OIDC -> IAM 역할 fillmap-ecr-push (저장된 AWS 키 없음, docs 잡과 같은 방식).
#   deploy-dev   : dev EC2 가 그 sha 태그를 pull 해 compose 로 교체 (api 서비스).
#   deploy-worker: AI EC2 의 인코딩 워커도 같은 이미지 (worker 서비스, 프로파일만 dev,encoding-worker).
#   docs         : dev 앱의 /v3/api-docs 스냅샷 -> docs.fillmap.kr (MSG-568).
#
# prod 는 이 sha 이미지를 다시 빌드하지 않고 태그만 옮겨 쓴다 (cd-prod.yml, 후속). 롤백 = 이전 sha 로 compose up.
# 서버의 env 파일·바인드 마운트 파일·nginx 는 그대로다. ECR pull 자격은 EC2 인스턴스 역할(FillMapEc2DevRole,
# AmazonEC2ContainerRegistryPullOnly) -> amazon-ecr-credential-helper 가 IMDS 로 얻는다. CD 는 헬퍼를 멱등 설치한다.
# repo variable DEPLOY_ENABLED=true 와 secrets DEV_EC2_* / AI_EC2_* 는 종전 그대로.
on:
  push:
    branches: [ develop ]

env:
  IMAGE: 951142447485.dkr.ecr.ap-northeast-2.amazonaws.com/fillmap

jobs:
  build-image:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # jar 는 gradle 캐시가 있는 러너에서 만들고 Dockerfile 은 담기만 한다 (Dockerfile 주석 참조)
      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951142447485:role/fillmap-ecr-push
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:develop" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:develop"

  deploy-dev:
    needs: build-image
    runs-on: ubuntu-latest
    environment: dev
    env:
      TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file to dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: docker-compose.app.yml
          target: /home/${{ secrets.DEV_EC2_USER }}

      - name: Deploy api container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE,TAG
          script: |
            set -e
            cd /home/${{ secrets.DEV_EC2_USER }}
            # ECR 자격 헬퍼 — 설치돼 있으면 통과, 새 인스턴스면 다음 배포가 알아서 복구 (ffmpeg 때와 같은 멱등 패턴)
            command -v docker-credential-ecr-login >/dev/null \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq amazon-ecr-credential-helper)
            mkdir -p ~/.docker
            grep -qs '"credsStore": *"ecr-login"' ~/.docker/config.json \
              || echo '{"credsStore":"ecr-login"}' > ~/.docker/config.json
            # 구 jar 방식 systemd 유닛이 살아 있으면 8080 을 두 프로세스가 다툰다. 첫 전환 때만 실제로 내리고
            # 그 뒤로는 no-op. 되돌리려면 이미지 대신 app.jar 로 `systemctl enable --now fillmap-dev`.
            sudo systemctl disable --now fillmap-dev 2>/dev/null || true
            docker compose -f docker-compose.app.yml pull -q api
            docker compose -f docker-compose.app.yml up -d api

      # compose up 은 컨테이너 생성까지만 보장한다 — 앱이 직후 죽어도 위 step 은 성공이다 (jar 시절 MSG-129 와 같은 구멍).
      - name: Health check api container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE,TAG
          script: |
            # 성공 = compose healthcheck(actuator 200) 가 healthy 이고, 그 컨테이너가 방금 push 한 태그로 떠 있을 때.
            # 이미지 대조가 jar 시절의 "8080 리스너 PID = MainPID" 검사를 대신한다 (MSG-382) — 200 을 준 것이
            # 옛 컨테이너·다른 프로세스가 아님을 확인한다. 앱 기동 ~15초 + start_period 를 감안해 150초 기다린다.
            deadline_start=$(date +%s)
            while [ $(( $(date +%s) - deadline_start )) -lt 150 ]; do
              status=$(docker inspect -f '{{.State.Health.Status}}' fillmap-api 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                running=$(docker inspect -f '{{.Config.Image}}' fillmap-api)
                if [ "$running" = "$IMAGE:$TAG" ]; then
                  echo "기동 확인 — healthy, image=$running ($(( $(date +%s) - deadline_start ))초)"
                  docker image prune -af >/dev/null   # 쓰지 않는 옛 이미지 정리 (롤백은 ECR 에서 다시 pull)
                  exit 0
                fi
                echo "::error::healthy 인 컨테이너의 이미지가 다르다 — 기대 $IMAGE:$TAG, 실제 $running"
                exit 1
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "missing" ]; then
                echo "::error::컨테이너 상태 $status — 아래 로그에서 원인 확인"
                docker logs --tail 50 fillmap-api 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            echo "::error::150초 내 healthy 실패 (마지막 상태: $status) — 아래 로그에서 원인 확인"
            docker logs --tail 50 fillmap-api 2>&1 || true
            exit 1

  deploy-worker:
    needs: build-image
    runs-on: ubuntu-latest
    environment: dev
    env:
      TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file to encoding worker EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          source: docker-compose.app.yml
          target: /home/${{ secrets.AI_EC2_USER }}/encoding-worker

      # AI EC2 는 ubuntu 가 docker 그룹이 아니라 sudo 로 돈다 — 자격 헬퍼 설정도 root 의 ~/.docker 에 둔다.
      - name: Deploy worker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          envs: IMAGE,TAG
          script: |
            set -e
            cd /home/${{ secrets.AI_EC2_USER }}/encoding-worker
            command -v docker-credential-ecr-login >/dev/null \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq amazon-ecr-credential-helper)
            sudo mkdir -p /root/.docker
            sudo grep -qs '"credsStore": *"ecr-login"' /root/.docker/config.json \
              || echo '{"credsStore":"ecr-login"}' | sudo tee /root/.docker/config.json >/dev/null
            sudo systemctl disable --now fillmap-encoding-worker 2>/dev/null || true
            sudo TAG="$TAG" docker compose -f docker-compose.app.yml pull -q worker
            sudo TAG="$TAG" docker compose -f docker-compose.app.yml up -d worker

      - name: Health check worker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          envs: IMAGE,TAG
          script: |
            deadline_start=$(date +%s)
            while [ $(( $(date +%s) - deadline_start )) -lt 150 ]; do
              status=$(sudo docker inspect -f '{{.State.Health.Status}}' fillmap-encoding-worker 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                running=$(sudo docker inspect -f '{{.Config.Image}}' fillmap-encoding-worker)
                if [ "$running" = "$IMAGE:$TAG" ]; then
                  echo "기동 확인 — healthy, image=$running ($(( $(date +%s) - deadline_start ))초)"
                  sudo docker image prune -af >/dev/null
                  exit 0
                fi
                echo "::error::healthy 인 컨테이너의 이미지가 다르다 — 기대 $IMAGE:$TAG, 실제 $running"
                exit 1
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "missing" ]; then
                echo "::error::컨테이너 상태 $status — 아래 로그에서 원인 확인"
                sudo docker logs --tail 50 fillmap-encoding-worker 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            echo "::error::150초 내 healthy 실패 (마지막 상태: $status) — 아래 로그에서 원인 확인"
            sudo docker logs --tail 50 fillmap-encoding-worker 2>&1 || true
            exit 1

  # API 문서 사이트 (MSG-568). dev 배포가 끝난 뒤 그 앱의 /v3/api-docs 를 받아 docs.fillmap.kr 에 올린다 —
  # 문서는 언제나 "지금 dev 에 떠 있는 코드"다. 스펙 URL 은 nginx basic auth 뒤라 DOCS_BASIC_AUTH 로 받고,
  # 앱이 올라오는 동안은 fetch 스크립트가 최대 2분 재시도한다. AWS 는 OIDC 역할(fillmap-docs-deploy)로,
  # 저장된 키 없음. 실패해도 dev 배포 자체는 이미 끝난 뒤라 앱에는 영향이 없다.
  docs:
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-docs/requirements.txt

      - name: Install MkDocs
        run: python3 -m pip install -r api-docs/requirements.txt

      - name: Snapshot OpenAPI from dev
        env:
          DOCS_BASIC_AUTH: ${{ secrets.DOCS_BASIC_AUTH }}
        run: api-docs/scripts/fetch-openapi.sh

      - name: Generate error code table
        run: python3 api-docs/scripts/gen-error-codes.py

      - name: Build site
        run: python3 -m mkdocs build --strict -f api-docs/mkdocs.yml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951142447485:role/fillmap-docs-deploy
          aws-region: ap-northeast-2

      - name: Upload to S3
        run: |
          aws s3 sync api-docs/site s3://fillmap-docs --delete \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id EEC1CHNPO5W2W --paths "/*"
