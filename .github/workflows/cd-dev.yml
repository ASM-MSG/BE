name: CD (dev)

# develop 브랜치 push -> dev 환경 자동 배포.
# EC2(MSG-51) 준비 전까지는 repo variable DEPLOY_ENABLED 로 비활성(skip) 상태.
# 준비되면 Settings > Variables 에 DEPLOY_ENABLED=true, 아래 secrets 등록:
#   DEV_EC2_HOST / DEV_EC2_USER / DEV_EC2_SSH_KEY
# dev 앱은 EC2에서 systemd 서비스 fillmap-dev (profile=dev, DB 5432 컨테이너)로 상시 구동.
# DB 접속·시크릿은 EC2의 서비스 .env 에 있고, CD는 jar 교체 + 재시작만 한다.
on:
  push:
    branches: [ develop ]

jobs:
  deploy-dev:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Upload jar to dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: build/libs/fillmap-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.DEV_EC2_USER }}
          strip_components: 2

      - name: Restart dev service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.DEV_EC2_USER }}
            # ffmpeg 는 인코딩·선분석 probe 의 런타임 의존인데, 설치가 문서 한 줄(docs/spec/MSG-65.md D3
            # "인프라 담당이 1회 실행")뿐이라 인스턴스 교체 때 유실됐다. 사람 기억 대신 매 배포가
            # 보장한다 — 설치돼 있으면 0.1초 통과, 새 인스턴스면 다음 배포가 알아서 복구 (멱등).
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            mv -f fillmap-0.0.1-SNAPSHOT.jar app.jar
            sudo systemctl restart fillmap-dev

      # systemctl restart 는 기동을 '지시'하고 즉시 0 을 반환한다 — 앱이 직후 죽어도 위 step 은 성공이다.
      # 실제로 2026-07-14~15 dev 가 32시간 크래시 루프였는데 CD 는 계속 초록불이었다 (MSG-129).
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            # 모든 경로가 인증을 요구하므로(SecurityConfig anyRequest().authenticated) 401 이 곧 기동 성공이다.
            # 응답이 온다는 것 자체가 신호 — 기동에 실패하면 컨텍스트가 안 떠서 포트가 아예 안 열린다.
            # 앱 기동에 ~14초 걸리므로 5초 간격으로 30회(약 150초) 기다린다.
            # 연결 실패 시 curl 은 %{http_code} 로 000 을 '출력하고' non-zero 로 끝난다. 따라서
            # `|| echo 000` 을 붙이면 000000 이 되어 어떤 조건에도 걸리지 않는다 — 실제 HTTP 코드만 통과시킨다.
            # TODO(MSG-128): actuator 도입되면 URL 을 /actuator/health 로 교체 (DB 연결까지 확인 가능).
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/actuator/health || true)
              case "$code" in
                2??|3??|4??)
                  echo "기동 확인 — HTTP $code ($((i * 5))초)"
                  exit 0
                  ;;
              esac
              sleep 5
            done
            echo "::error::150초 내 기동 실패 — 아래 로그에서 원인 확인"
            journalctl -u fillmap-dev -n 50 --no-pager
            exit 1
