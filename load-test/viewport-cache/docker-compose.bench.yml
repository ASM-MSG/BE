# 뷰포트 캐시 전략 비교용 로컬 스택 — API N 대(각 1 CPU · 768MB) 뒤에 nginx 라운드로빈.
# DB·Redis 는 docker-compose.yml 의 로컬 컨테이너를 host.docker.internal 로 같이 쓴다.
#
#   docker build -t fillmap-bench .                                   # jar 를 담은 이미지 (루트 Dockerfile)
#   VIEWPORT_CACHE_MODE=local docker compose -f load-test/viewport-cache/docker-compose.bench.yml up -d --scale api=4
#   curl localhost:8090/actuator/health
#
# nginx 는 기동 시 api 호스트명을 한 번 풀어 그때 있는 복제본 전부에 라운드로빈한다.
# --scale 을 바꾸면 nginx 를 다시 만들어야 한다 (run-viewport-cache-experiment.sh 가 그렇게 한다).
services:
  api:
    image: fillmap-bench
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/fillmap
      SPRING_DATA_REDIS_HOST: host.docker.internal
      # local 프로파일의 SQL 로그(show-sql·DEBUG)는 부하에서 그 자체가 병목이라 끈다. 로거 이름은
      # 대소문자를 타서 환경변수 대신 시스템 프로퍼티로 넘긴다.
      # 실험 변수
      VIEWPORT_CACHE_MODE: ${VIEWPORT_CACHE_MODE:-none}
      VIEWPORT_CACHE_TTL: ${VIEWPORT_CACHE_TTL:-PT30S}
      VIEWPORT_CACHE_SNAP_CELLS: ${VIEWPORT_CACHE_SNAP_CELLS:-64}
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx512m -XX:+UseSerialGC -Dspring.jpa.show-sql=false -Dlogging.level.org.hibernate.SQL=WARN -Dlogging.level.org.hibernate.orm.jdbc.bind=WARN -Dlogging.level.com.fillmap=INFO"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 2s
      retries: 40
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
