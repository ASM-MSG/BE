worker_processes 2;
events { worker_connections 4096; }
http {
	access_log off;
	# api 호스트명은 기동 시 한 번 풀린다 — compose --scale 로 뜬 복제본 IP 전부에 라운드로빈.
	upstream api { server api:8080; keepalive 64; }
	server {
		listen 80;
		location / {
			proxy_pass http://api;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_read_timeout 30s;
		}
	}
}
