# MSG-344 상시 관측 스택 (prod). 부하테스트용 임시 스택(monitoring/)과 물리적으로 분리 — 임시 스택은 그대로 남긴다.
# 배치 위치: fillmap-ai EC2 (52.78.158.240) — 대상(prod 앱)과 다른 박스에서 수집한다("대상 서버 밖 수집" 요구).
# 필요 환경변수: .env.example 을 .env 로 복사해 채운다. :?required 필수 보간이라 빠지면 up 자체가
# 실패한다 — 자리표시자가 빈 값으로 치환된 채 조용히 기동하는 것을 막는다.
# 웹 UI 3종(9090/3000/9093)은 전부 루프백 바인딩 — Grafana·Prometheus 가 평문 HTTP 라 외부 노출
# 금지, 접근은 SSH 터널이 유일 경로다(runbook). Prometheus 의 나가는 scrape 는 영향 없다.
# 기동: docker compose -f monitoring/prod/docker-compose.yml up -d
# 알림 대응·재기동·prod 미가동 기간 조치: docs/runbook/monitoring.md

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 보관 30일 — 현 시계열 규모(수천 개) x 15s 간격이면 대략 1~2GB 로 t3.small 디스크에 충분 (근거는 runbook)
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus    # 보관 30일이 재기동에도 유지되게 데이터는 볼륨에
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    # fillmap-ai 가용 메모리 실측 1070MiB — 셋 합계를 그 아래로 캡해 동거 프로세스를 지킨다
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # Alertmanager 는 설정 파일의 환경변수 확장을 지원하지 않는다 — 기동 시 셸이 자리표시자를
    # SLACK_WEBHOOK_URL 값으로 치환한다. webhook URL 은 레포에 넣지 않는다(MSG-344 결정).
    entrypoint: /bin/sh
    command:
      - -c
      - sed "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?required}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # silence·알림 상태 보존 — 없으면 컨테이너 재생성마다 prod 미가동 silence 가 날아가
      # AppDown 반복 알림이 재개된다 (runbook "prod 미가동 기간의 타깃 DOWN 조치")
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # 익명 접근 차단 — 임시 스택의 익명 Viewer 는 상시 노출에 부적합 (MSG-344). 비밀번호는 환경변수 주입.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
