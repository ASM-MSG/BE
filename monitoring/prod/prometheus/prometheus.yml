# MSG-344 상시 수집 설정. 임시 스택(monitoring/prometheus)의 5s 는 부하 구간용 — 상시엔 15s 로 충분하다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # prod 앱의 관리 포트(8081, MSG-344 1단계). 인바운드는 보안그룹이 수집 서버 소스
  # (sg-05e4d5c7ddfa6c438, fillmap-ai-sg)만 허용한다.
  # 타깃은 사설 IP(fillmap-dev 10.0.1.24)다 — 같은 VPC 사설 경로여야 보안그룹 소스 그룹
  # 매칭이 성립한다(공인 IP 로 바꾸면 8081 인바운드에 안 잡혀 scrape 실패). 인스턴스 교체로
  # 사설 IP 가 바뀌면 docs/runbook/monitoring.md 와 함께 갱신한다.
  # 주의: prod 앱은 아직 상시 구동 전이라 지금은 이 타깃이 DOWN 인 게 정상이다 — prod 가 뜰
  # 때까지 AppDown 알림은 Alertmanager silence 로 막는다 (docs/runbook/monitoring.md 절차).
  - job_name: fillmap-prod
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.1.24:8081"]
        labels:
          service: fillmap
          env: prod

  # dev 앱 (MSG-377). dev 프로파일은 관리 포트 분리 없이 앱 포트 8080 에 actuator 가 있다
  # (Nginx 가 /actuator 를 외부 차단하고, 8080 인바운드는 보안그룹이 수집 서버 소스만
  # 허용 — 8081 규칙과 같은 패턴). 관리 포트를 새로 파지 않는 이유: application-dev.yml,
  # cd-dev.yml 헬스체크, 이 파일 세 곳을 건드리는 비용 대비 실익이 없다.
  - job_name: fillmap-dev
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.1.24:8080"]
        labels:
          service: fillmap
          env: dev

  # 수집 서버 자기 자신 — 스택 자체의 이상을 남기기 위해.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
