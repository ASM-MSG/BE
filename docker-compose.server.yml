# EC2 서버 전용 — dev / prod DB를 같은 호스트에서 별도 컨테이너로 격리 운용.
# 로컬 개발은 docker-compose.yml 사용. 이 파일은 EC2에서만 띄운다.
#
#   docker compose -f docker-compose.server.yml up -d
#
# dev 앱(profile=dev)  -> localhost:5432 (postgres-dev)
# prod 앱(profile=prod) -> localhost:5433 (postgres-prod, DB_URL로 주입)
#
# ⚠️ 비밀번호는 아래 기본값을 그대로 쓰지 말고 .env 파일로 주입할 것.
services:
  postgres-dev:
    image: postgis/postgis:16-3.4-alpine
    container_name: fillmap-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fillmap
      POSTGRES_USER: ${DEV_DB_USER:-dev}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-dev1234}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-dev} -d fillmap" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-prod:
    image: postgis/postgis:16-3.4-alpine
    container_name: fillmap-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: fillmap
      POSTGRES_USER: ${PROD_DB_USER:-prod}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?PROD_DB_PASSWORD 필수}
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-prod} -d fillmap" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — 인프라만 격리 배치 (앱 연동은 실제 사용 기능 생길 때).
  # dev=6379, prod=6380. prod는 requirepass 필수.
  redis-dev:
    image: redis:7-alpine
    container_name: fillmap-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-prod:
    image: redis:7-alpine
    container_name: fillmap-redis-prod
    restart: unless-stopped
    # 앱(application-prod.yml)이 읽는 REDIS_PASSWORD 와 같은 이름을 쓴다 — 이원화 시 한쪽만 바꾸면
    # 기동 검증은 통과하고 런타임 인증 실패가 난다 (MSG-279)
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 필수}" ]
    ports:
      - "6380:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka — 알림 발송 파이프라인 (MSG-179 D1/D2). postgres/redis 와 달리 dev/prod 가 브로커 1개를
  # 공유한다 — dev EC2(t3.small, 2GB) available 613Mi 실측에 2벌은 물리적으로 불가. 격리는 토픽
  # prefix(dev./prod.)와 컨슈머 그룹으로 한다. 힙 256MB + 오프힙 여유 = 리밋 512MB — OOM 시 t3.medium 승급 검토.
  kafka:
    image: apache/kafka:3.9.1
    container_name: fillmap-kafka
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  pgdata_dev:
  pgdata_prod:
  redisdata_dev:
  redisdata_prod:
  kafkadata:
