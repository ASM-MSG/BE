# 운영 — AWS RDS + ElastiCache
# 실제 값은 환경변수로 주입 (EC2/ECS 환경변수, Secrets Manager 등)
spring:
  datasource:
    url: ${DB_URL}                 # 예: jdbc:postgresql://fillmap.xxx.ap-northeast-2.rds.amazonaws.com:5432/fillmap
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false                # 운영에선 절대 켜지 말 것

  # Redis — EC2 docker-compose.server.yml 의 fillmap-redis-prod (6380, requirepass 필수)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6380}
      # 기본값을 두지 않는다. 단 미설정 시에도 바인더는 리터럴 "${REDIS_PASSWORD}" 로 통과시키므로
      # 기동 실패는 ProdRedisPasswordValidator 가 보장한다. (MSG-244 Codex 리뷰)
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}

jwt:
  # kebab-case(refresh-secret)는 JWT_REFRESH_SECRET env 로 relaxed binding 이 되지 않아 명시적으로 매핑한다.
  # 기본값을 두지 않는다 — 미설정 시 기동 실패로 즉시 드러나게 한다. (MSG-135)
  refresh-secret: ${JWT_REFRESH_SECRET}

aws:
  s3:
    # 기본값을 두지 않는다 — 미설정 시 application.yml 기본값(fillmap-video-dev)으로 흘러
    # prod 영상이 dev 버킷에 조용히 쌓인다. 기동 실패로 즉시 드러나게 한다.
    bucket: ${S3_BUCKET_VIDEO}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.fillmap: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO