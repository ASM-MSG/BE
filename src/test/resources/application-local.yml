# 테스트 전용 local 프로파일 오버라이드 — @SpringBootTest 컨텍스트 로드용 더미 값.
# main application.yml(issuer·jwk-set-uri·flyway 등)은 그대로 살아있고, 여기서는
# local 프로파일이 요구하는 datasource·jwt.secret·kakao client-id만 채운다.
# CI는 이 datasource(localhost:5432)에 PostGIS 서비스 컨테이너를 붙인다.
# Redis(MSG-135)도 동일 — 로컬 fillmap-local-redis / CI redis 서비스 컨테이너 (localhost:6379).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fillmap
    username: user
    password: user1234
    # 스위트가 캐시하는 스프링 컨텍스트마다 풀이 하나씩 살아있어, 기본 풀 10 × 컨텍스트 수가
    # postgres max_connections(100, 로컬·CI 동일)를 넘는다 — zone 컨텍스트 추가로 실제 초과
    # ("too many clients already"). 테스트는 컨텍스트당 동시 쿼리가 적어 2로 충분하다.
    hikari:
      maximum-pool-size: 2

  # 공유 로컬 DB는 여러 브랜치가 함께 쓴다 — 다른 브랜치 세션이 적용한 미머지 마이그레이션이
  # 이 브랜치에 파일로 없으면 validate가 "applied but not resolved"로 죽는다(V7=MSG-238 선점 사례).
  # 테스트에서만 missing을 허용한다. CI는 매번 새 DB라 이 패턴이 발동할 일 없고, dev/prod는 무영향.
  flyway:
    ignore-migration-patterns: "*:missing"

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-0123456789-0123456789-0123456789
  refresh-secret: test-refresh-secret-0123456789-0123456789-0123456789

oauth:
  kakao:
    client-id: test-client-id
